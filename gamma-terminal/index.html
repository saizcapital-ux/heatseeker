<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ Gamma Flow Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="engine.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #21262d;
      --pos:      #3fb950;
      --neg:      #f85149;
      --spot:     #58a6ff;
      --flip:     #d29922;
      --text:     #e6edf3;
      --muted:    #7d8590;
      --font-ui:  'Space Grotesk', system-ui, sans-serif;
      --font-mono:'IBM Plex Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Focus rings ── */
    :focus-visible {
      outline: 2px solid var(--spot);
      outline-offset: 2px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--flip);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .symbol-buttons {
      display: flex;
      gap: 6px;
    }

    .sym-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sym-btn:hover {
      border-color: var(--spot);
      color: var(--spot);
    }

    .sym-btn.active {
      background: rgba(88, 166, 255, 0.12);
      border-color: var(--spot);
      color: var(--spot);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .spot-display {
      text-align: right;
    }

    .spot-price {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--spot);
    }

    .spot-time {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.15s;
      line-height: 1;
    }

    .refresh-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    /* ── Regime banner ── */
    #regime-banner {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    #regime-banner.pos {
      background: rgba(63, 185, 80, 0.08);
      border-left: 4px solid var(--pos);
    }

    #regime-banner.neg {
      background: rgba(248, 81, 73, 0.08);
      border-left: 4px solid var(--neg);
    }

    .regime-label {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .regime-label.pos { color: var(--pos); }
    .regime-label.neg { color: var(--neg); }

    .regime-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .regime-gex {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .regime-interp {
      font-size: 0.82rem;
      color: var(--muted);
      max-width: 480px;
      text-align: right;
    }

    /* ── Metric cards ── */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }

    .metric-card {
      background: var(--surface);
      padding: 16px 20px;
    }

    .metric-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .metric-value {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 500;
    }

    .metric-value.amber { color: var(--flip); }
    .metric-value.green { color: var(--pos); }
    .metric-value.red   { color: var(--neg); }
    .metric-value.muted { color: var(--muted); }

    .metric-sub {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Controls ── */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-group label {
      font-size: 0.82rem;
      color: var(--text);
      cursor: pointer;
    }

    .toggle-group .hint {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 1px;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--spot);
      cursor: pointer;
    }

    .expiry-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .expiry-group label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    select:focus-visible {
      outline: 2px solid var(--spot);
    }

    /* ── Charts ── */
    .charts-area {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .chart-title {
      padding: 12px 18px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    #bar-chart  { width: 100%; height: 500px; }
    #surf-chart { width: 100%; height: 480px; }

    /* ── Loading / Error ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 200;
    }

    #overlay.hidden { display: none; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--spot);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: var(--spot); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay-text {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--muted);
    }

    .error-box {
      background: var(--surface);
      border: 1px solid var(--neg);
      border-radius: 8px;
      padding: 24px 32px;
      max-width: 480px;
      text-align: center;
    }

    .error-title {
      color: var(--neg);
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .error-msg {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .error-retry {
      margin-top: 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.85rem;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .error-retry:hover { border-color: var(--spot); color: var(--spot); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      header { padding: 10px 16px; }
      .charts-area { padding: 12px 14px; }
      .metrics-row { grid-template-columns: repeat(2, 1fr); }
      .metric-value { font-size: 1.05rem; }
      #bar-chart  { height: 380px; }
      #surf-chart { height: 340px; }
      .regime-interp { text-align: left; }
      .regime-right  { align-items: flex-start; }
    }

    @media (max-width: 480px) {
      .logo { font-size: 0.95rem; }
      .metric-value { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<!-- Loading/Error overlay -->
<div id="overlay" role="status" aria-live="polite">
  <div class="spinner"></div>
  <div class="overlay-text">Fetching CBOE data…</div>
</div>

<!-- Header -->
<header>
  <div class="logo">⚡ GAMMA FLOW</div>

  <div class="symbol-buttons" role="group" aria-label="Select symbol">
    <button class="sym-btn active" data-sym="SPX" aria-pressed="true">SPX</button>
    <button class="sym-btn"        data-sym="VIX" aria-pressed="false">VIX</button>
    <button class="sym-btn"        data-sym="SPY" aria-pressed="false">SPY</button>
  </div>

  <div class="header-right">
    <div class="spot-display">
      <div class="spot-price" id="spot-price">—</div>
      <div class="spot-time"  id="spot-time">as of —</div>
    </div>
    <button class="refresh-btn" id="refresh-btn" aria-label="Refresh data">↻</button>
  </div>
</header>

<!-- Regime banner -->
<div id="regime-banner" class="pos" role="region" aria-label="Regime status">
  <div class="regime-label pos" id="regime-label">—</div>
  <div class="regime-right">
    <div class="regime-gex" id="regime-gex">—</div>
    <div class="regime-interp" id="regime-interp">Loading…</div>
  </div>
</div>

<!-- Metric cards -->
<div class="metrics-row" role="region" aria-label="Key levels">
  <div class="metric-card">
    <div class="metric-label">Gamma Flip</div>
    <div class="metric-value amber" id="m-flip">—</div>
    <div class="metric-sub" id="m-charm">Charm: —</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Call Wall</div>
    <div class="metric-value green" id="m-call-wall">—</div>
    <div class="metric-sub" id="m-vanna">Vanna: —</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Put Wall</div>
    <div class="metric-value red" id="m-put-wall">—</div>
    <div class="metric-sub">&nbsp;</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Max Pain</div>
    <div class="metric-value muted" id="m-max-pain">—</div>
    <div class="metric-sub">&nbsp;</div>
  </div>
</div>

<!-- Controls -->
<div class="controls-bar">
  <div class="toggle-group">
    <input type="checkbox" id="dealer-toggle" checked aria-describedby="dealer-hint" />
    <div>
      <label for="dealer-toggle">Dealer Long Calls</label>
      <div class="hint" id="dealer-hint">Checked = dealers bought calls (sold puts) — standard MM hedging assumption</div>
    </div>
  </div>
  <div class="expiry-group">
    <label for="expiry-filter">Expiry:</label>
    <select id="expiry-filter" aria-label="Filter by expiration date">
      <option value="all">All expirations</option>
    </select>
  </div>
</div>

<!-- Charts -->
<div class="charts-area">
  <div class="chart-card">
    <div class="chart-title">Net GEX by Strike &nbsp;·&nbsp; $M per 1% move</div>
    <div id="bar-chart"></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">GEX Surface: Strike × Expiry</div>
    <div id="surf-chart"></div>
  </div>
</div>

<script>
/* ──────────────────────────────────────────────────────────────────────
   App state & constants
────────────────────────────────────────────────────────────────────── */
const API = '/api/chain';

let state = {
  symbol:         'SPX',
  dealerLongCalls: true,
  expiryFilter:   'all',
};

let lastResult = null;

/* ──────────────────────────────────────────────────────────────────────
   Formatting helpers
────────────────────────────────────────────────────────────────────── */
function fmtPrice(n) {
  if (n == null || !isFinite(n)) return '—';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function fmtGEX(n) {
  // Convert raw dollars to $B
  if (n == null || !isFinite(n)) return '—';
  const b = n / 1e9;
  const sign = b >= 0 ? '+' : '';
  return sign + b.toFixed(2) + 'B';
}

function fmtFlow(n) {
  if (n == null || !isFinite(n)) return '—';
  const m = n / 1e6;
  const sign = m >= 0 ? '+' : '';
  return sign + m.toFixed(1) + 'M';
}

function nowET() {
  return new Date().toLocaleTimeString('en-US', {
    hour: '2-digit', minute: '2-digit', timeZone: 'America/New_York'
  });
}

/* ──────────────────────────────────────────────────────────────────────
   Overlay helpers
────────────────────────────────────────────────────────────────────── */
const overlay = document.getElementById('overlay');

function showLoading() {
  overlay.innerHTML = `<div class="spinner"></div><div class="overlay-text">Fetching CBOE data…</div>`;
  overlay.classList.remove('hidden');
}

function showError(e) {
  const msg = e?.message || String(e);
  overlay.innerHTML = `
    <div class="error-box" role="alert">
      <div class="error-title">Feed unavailable</div>
      <div class="error-msg">
        The CBOE feed is unreachable — this usually means the market is closed or the CDN is down.
        Try again after 9:30 AM ET.<br><br>
        <span style="color:var(--neg);font-family:var(--font-mono);font-size:0.75rem">${msg}</span>
      </div>
      <button class="error-retry" id="err-retry">Try again</button>
    </div>`;
  overlay.classList.remove('hidden');
  document.getElementById('err-retry').addEventListener('click', fetchAndRender);
}

function hideOverlay() {
  overlay.classList.add('hidden');
}

/* ──────────────────────────────────────────────────────────────────────
   Fetch & render pipeline
────────────────────────────────────────────────────────────────────── */
async function fetchAndRender() {
  showLoading();
  try {
    const r = await fetch(`${API}?symbol=${state.symbol}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const raw = await r.json();
    if (raw.error) throw new Error(raw.error);
    const result = window.GammaEngine.analyze(raw, state.symbol, state.dealerLongCalls);
    lastResult = result;
    populateExpiryFilter(result);
    render(result);
    hideOverlay();
  } catch (e) {
    showError(e);
  }
}

/* ──────────────────────────────────────────────────────────────────────
   Expiry filter population
────────────────────────────────────────────────────────────────────── */
function populateExpiryFilter(result) {
  const sel = document.getElementById('expiry-filter');
  const expiries = Object.keys(result.gexByExpiry).sort();
  const prev = sel.value;
  sel.innerHTML = '<option value="all">All expirations</option>';
  for (const e of expiries) {
    const opt = document.createElement('option');
    opt.value = e;
    opt.textContent = e;
    sel.appendChild(opt);
  }
  if (expiries.includes(prev)) sel.value = prev;
}

/* ──────────────────────────────────────────────────────────────────────
   Main render function
────────────────────────────────────────────────────────────────────── */
function render(result) {
  const { spot, regime, netGEX, gammaFlip, callWall, putWall, maxPain,
          gexByStrike, gexSurface, totalCharmFlow, totalVannaFlow } = result;

  /* Header */
  document.getElementById('spot-price').textContent = fmtPrice(spot);
  document.getElementById('spot-time').textContent  = `as of ${nowET()} ET`;

  /* Regime banner */
  const banner   = document.getElementById('regime-banner');
  const label    = document.getElementById('regime-label');
  const regGex   = document.getElementById('regime-gex');
  const regInterp= document.getElementById('regime-interp');

  const isPos = regime === 'POSITIVE GAMMA';
  banner.className = isPos ? 'pos' : 'neg';
  label.className  = `regime-label ${isPos ? 'pos' : 'neg'}`;
  label.textContent = regime;
  regGex.textContent = `Net GEX: ${fmtGEX(netGEX)}`;
  regGex.style.color = isPos ? 'var(--pos)' : 'var(--neg)';

  if (isPos) {
    const cw = callWall ? fmtPrice(callWall) : '—';
    const pw = putWall  ? fmtPrice(putWall)  : '—';
    const fl = gammaFlip ? fmtPrice(gammaFlip) : '—';
    regInterp.textContent =
      `Dealers are net-long gamma. Expect mean-reversion between ${pw} and ${cw}. ${fl} is the regime boundary.`;
  } else {
    const fl = gammaFlip ? fmtPrice(gammaFlip) : '—';
    regInterp.textContent =
      `Dealers are net-short gamma. Expect trending / breakout conditions. ${fl} is the gamma flip line — a break below signals amplified selling.`;
  }

  /* Metric cards */
  document.getElementById('m-flip').textContent     = gammaFlip ? fmtPrice(gammaFlip) : '—';
  document.getElementById('m-call-wall').textContent = callWall ? fmtPrice(callWall) : '—';
  document.getElementById('m-put-wall').textContent  = putWall  ? fmtPrice(putWall)  : '—';
  document.getElementById('m-max-pain').textContent  = maxPain  ? fmtPrice(maxPain)  : '—';
  document.getElementById('m-charm').textContent = `Charm: ${fmtFlow(totalCharmFlow)}`;
  document.getElementById('m-vanna').textContent = `Vanna: ${fmtFlow(totalVannaFlow)}`;

  /* Charts */
  renderBarChart(result);
  renderSurfaceChart(result);
}

/* ──────────────────────────────────────────────────────────────────────
   GEX bar chart (horizontal, strike on Y)
────────────────────────────────────────────────────────────────────── */
function getFilteredStrikes(result) {
  const { spot, gexByStrike, gexSurface } = result;
  const expiryFilter = state.expiryFilter;

  // Apply expiry filter to surface data to get filtered gexByStrike
  let filteredGexByStrike = {};

  if (expiryFilter === 'all') {
    filteredGexByStrike = { ...gexByStrike };
  } else {
    for (const pt of gexSurface) {
      if (pt.expiry === expiryFilter) {
        filteredGexByStrike[pt.strike] = (filteredGexByStrike[pt.strike] || 0) + pt.gex;
      }
    }
  }

  // Filter to spot ± 10% (or ±250 for SPX-class)
  const range = spot > 1000 ? 250 : spot * 0.10;
  const lo = spot - range;
  const hi = spot + range;

  const strikes = Object.keys(filteredGexByStrike)
    .map(Number)
    .filter(s => s >= lo && s <= hi)
    .sort((a, b) => a - b);

  return { strikes, filteredGexByStrike };
}

function renderBarChart(result) {
  const { spot, gammaFlip } = result;
  const { strikes, filteredGexByStrike } = getFilteredStrikes(result);

  const gexValues = strikes.map(s => filteredGexByStrike[s] / 1e6); // in $M
  const colors    = gexValues.map(v => v >= 0 ? 'rgba(63,185,80,0.75)' : 'rgba(248,81,73,0.75)');

  const trace = {
    type: 'bar',
    orientation: 'h',
    x: gexValues,
    y: strikes,
    marker: { color: colors },
    hovertemplate: 'Strike: %{y}<br>GEX: $%{x:.1f}M<extra></extra>',
  };

  // Spot & flip lines as shapes
  const shapes = [
    {
      type: 'line', xref: 'paper', yref: 'y',
      x0: 0, x1: 1, y0: spot, y1: spot,
      line: { color: 'var(--spot)', width: 1.5, dash: 'dot' },
    },
  ];

  if (gammaFlip) {
    shapes.push({
      type: 'line', xref: 'paper', yref: 'y',
      x0: 0, x1: 1, y0: gammaFlip, y1: gammaFlip,
      line: { color: 'var(--flip)', width: 1.5 },
    });
  }

  // Background zones
  const xMax = Math.max(...gexValues.map(Math.abs), 1) * 1.3;
  if (gammaFlip) {
    shapes.push(
      {
        type: 'rect', xref: 'x', yref: 'y',
        x0: -xMax, x1: xMax,
        y0: gammaFlip, y1: Math.max(...strikes, spot) + 50,
        fillcolor: 'rgba(63,185,80,0.04)', line: { width: 0 },
        layer: 'below',
      },
      {
        type: 'rect', xref: 'x', yref: 'y',
        x0: -xMax, x1: xMax,
        y0: Math.min(...strikes, spot) - 50, y1: gammaFlip,
        fillcolor: 'rgba(248,81,73,0.04)', line: { width: 0 },
        layer: 'below',
      }
    );
  }

  const annotations = [
    {
      xref: 'paper', yref: 'y',
      x: 0.01, y: spot,
      text: `SPOT ${fmtPrice(spot)}`,
      showarrow: false,
      font: { color: 'var(--spot)', size: 10, family: 'IBM Plex Mono' },
      xanchor: 'left', yanchor: 'bottom',
    },
  ];

  if (gammaFlip) {
    annotations.push({
      xref: 'paper', yref: 'y',
      x: 0.01, y: gammaFlip,
      text: `FLIP ${fmtPrice(gammaFlip)}`,
      showarrow: false,
      font: { color: 'var(--flip)', size: 10, family: 'IBM Plex Mono' },
      xanchor: 'left', yanchor: 'bottom',
    });
  }

  const layout = {
    paper_bgcolor: '#0d1117',
    plot_bgcolor:  '#0d1117',
    margin: { l: 70, r: 20, t: 10, b: 40 },
    xaxis: {
      title: { text: 'GEX ($M)', font: { color: '#7d8590', size: 11 } },
      gridcolor: '#21262d',
      zerolinecolor: '#444',
      tickfont: { color: '#7d8590', family: 'IBM Plex Mono', size: 10 },
      color: '#7d8590',
    },
    yaxis: {
      title: { text: 'Strike', font: { color: '#7d8590', size: 11 } },
      gridcolor: '#21262d',
      tickfont: { color: '#7d8590', family: 'IBM Plex Mono', size: 10 },
      color: '#7d8590',
      tickformat: ',d',
    },
    shapes,
    annotations,
    showlegend: false,
    font: { family: 'Space Grotesk', color: '#e6edf3' },
    transition: { duration: prefersReducedMotion() ? 0 : 300, easing: 'cubic-in-out' },
  };

  Plotly.react('bar-chart', [trace], layout, { displayModeBar: false, responsive: true });
}

/* ──────────────────────────────────────────────────────────────────────
   3D surface chart
────────────────────────────────────────────────────────────────────── */
function renderSurfaceChart(result) {
  const { gexSurface, spot } = result;

  if (!gexSurface || gexSurface.length === 0) return;

  // Filter to spot ± 10%
  const range = spot > 1000 ? 300 : spot * 0.12;
  const lo = spot - range;
  const hi = spot + range;

  const filtered = gexSurface.filter(p => p.strike >= lo && p.strike <= hi);

  const strikes  = [...new Set(filtered.map(p => p.strike))].sort((a,b) => a-b);
  const expiries = [...new Set(filtered.map(p => p.expiry))].sort();

  if (strikes.length < 2 || expiries.length < 2) return;

  // Build Z matrix [expiry rows × strike cols]
  const gexMap = {};
  for (const p of filtered) {
    const key = `${p.expiry}|${p.strike}`;
    gexMap[key] = (gexMap[key] || 0) + p.gex;
  }

  const z = expiries.map(exp =>
    strikes.map(str => (gexMap[`${exp}|${str}`] || 0) / 1e6)
  );

  const trace = {
    type: 'surface',
    x: strikes,
    y: expiries,
    z,
    colorscale: [[0,'#f85149'],[0.5,'#21262d'],[1,'#3fb950']],
    showscale: true,
    colorbar: {
      tickfont: { color: '#7d8590', family: 'IBM Plex Mono', size: 9 },
      title: { text: '$M', font: { color: '#7d8590', size: 10 } },
      thickness: 12,
      len: 0.6,
    },
    hovertemplate: 'Strike: %{x}<br>Expiry: %{y}<br>GEX: $%{z:.1f}M<extra></extra>',
  };

  const layout = {
    paper_bgcolor: '#0d1117',
    margin: { l: 0, r: 0, t: 10, b: 0 },
    scene: {
      bgcolor: '#0d1117',
      xaxis: {
        title: 'Strike',
        gridcolor: '#21262d', zerolinecolor: '#444',
        tickfont: { color: '#7d8590', size: 9, family: 'IBM Plex Mono' },
        color: '#7d8590',
      },
      yaxis: {
        title: 'Expiry',
        gridcolor: '#21262d', zerolinecolor: '#444',
        tickfont: { color: '#7d8590', size: 9, family: 'IBM Plex Mono' },
        color: '#7d8590',
      },
      zaxis: {
        title: 'GEX ($M)',
        gridcolor: '#21262d', zerolinecolor: '#444',
        tickfont: { color: '#7d8590', size: 9, family: 'IBM Plex Mono' },
        color: '#7d8590',
      },
    },
    font: { family: 'Space Grotesk', color: '#e6edf3' },
  };

  Plotly.react('surf-chart', [trace], layout, { displayModeBar: false, responsive: true });
}

/* ──────────────────────────────────────────────────────────────────────
   Motion preference helper
────────────────────────────────────────────────────────────────────── */
function prefersReducedMotion() {
  return window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
}

/* ──────────────────────────────────────────────────────────────────────
   Event listeners
────────────────────────────────────────────────────────────────────── */

// Symbol buttons
document.querySelectorAll('.sym-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sym-btn').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    state.symbol = btn.dataset.sym;
    state.expiryFilter = 'all';
    document.getElementById('expiry-filter').value = 'all';
    fetchAndRender();
  });
});

// Dealer toggle
document.getElementById('dealer-toggle').addEventListener('change', e => {
  state.dealerLongCalls = e.target.checked;
  if (lastResult) {
    // Re-analyze cached raw data isn't available, so re-fetch
    fetchAndRender();
  }
});

// Expiry filter
document.getElementById('expiry-filter').addEventListener('change', e => {
  state.expiryFilter = e.target.value;
  if (lastResult) {
    renderBarChart(lastResult);
    renderSurfaceChart(lastResult);
  }
});

// Refresh button
document.getElementById('refresh-btn').addEventListener('click', fetchAndRender);

/* ──────────────────────────────────────────────────────────────────────
   Boot
────────────────────────────────────────────────────────────────────── */
fetchAndRender();
</script>
</body>
</html>
