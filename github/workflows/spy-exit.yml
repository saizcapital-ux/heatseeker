name: SPY Exit Manager

on:
  schedule:
    - cron: "0 15 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "45 19 * * 1-5"
  workflow_dispatch:
    inputs:
      force_close:
        description: "Force close all open SPY 0DTE positions"
        required: false
        default: "false"
      dry_run:
        description: "Dry run (no real orders)"
        required: false
        default: "true"

jobs:
  exit:
    name: Check + Close SPY 0DTE Positions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run exit manager
        env:
          RH_USERNAME:       ${{ secrets.RH_USERNAME }}
          RH_PASSWORD:       ${{ secrets.RH_PASSWORD }}
          RH_MFA_CODE:       ${{ secrets.RH_MFA_CODE }}
          RH_ACCOUNT_NUMBER: "634079917"
          DRY_RUN:           ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_CLOSE: >-
            ${{
              github.event.inputs.force_close == 'true' ||
              (github.event_name == 'schedule' && github.event.schedule == '45 19 * * 1-5')
            }}
        run: python scripts/spy_exit.py
