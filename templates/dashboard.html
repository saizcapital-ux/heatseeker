<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEATSEEKER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e8e8f0;font-family:'SF Mono',monospace;min-height:100vh;padding:16px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{font-size:18px;font-weight:900;color:#ffaa00;letter-spacing:3px}
.live{font-size:11px;color:#00ff88;background:#051505;border:1px solid #00ff88;padding:3px 10px;border-radius:20px}
.clock{font-size:11px;color:#666680}

/* Signal box — the main thing */
.signal-box{border-radius:12px;padding:24px;margin-bottom:16px;text-align:center;border:2px solid #2a2a3a;background:#111118}
.signal-box.call{border-color:#00ff88;background:#051505}
.signal-box.put{border-color:#ff3366;background:#150508}
.signal-box.flat{border-color:#2a2a3a;background:#111118}
.sig-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#666680;margin-bottom:8px}
.sig-main{font-size:48px;font-weight:900;line-height:1}
.sig-call{color:#00ff88}
.sig-put{color:#ff3366}
.sig-flat{color:#444460}
.sig-sub{font-size:13px;color:#888899;margin-top:8px}

/* Price row */
.prices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.price-card{background:#111118;border:1px solid #1e1e2e;border-radius:8px;padding:14px;text-align:center}
.pc-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#555570;margin-bottom:4px}
.pc-val{font-size:22px;font-weight:700}

/* Status card */
.status-card{background:#111118;border:1px solid #1e1e2e;border-radius:8px;padding:14px;margin-bottom:12px}
.status-title{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#555570;margin-bottom:8px}
.status-text{font-size:12px;color:#888899;line-height:1.6}
.status-updated{font-size:10px;color:#444460;margin-top:6px}

/* Vol signals row */
.vol-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.vol-chip{background:#111118;border:1px solid #1e1e2e;border-radius:8px;padding:10px 12px}
.vc-label{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:#555570;margin-bottom:3px}
.vc-val{font-size:13px;font-weight:700}

/* Journal */
.journal-card{background:#111118;border:1px solid #1e1e2e;border-radius:8px;padding:14px}
.j-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1a1a24;font-size:11px}
.j-row:last-child{border-bottom:none}
.j-date{color:#555570;min-width:55px}
.j-type-call{color:#00ff88;font-weight:700;min-width:35px}
.j-type-put{color:#ff3366;font-weight:700;min-width:35px}
.j-strike{color:#888899;min-width:50px}
.j-pnl-win{color:#00ff88;font-weight:700;margin-left:auto}
.j-pnl-loss{color:#ff3366;font-weight:700;margin-left:auto}
.j-open{color:#ffaa00;font-weight:700;margin-left:auto}
.j-empty{color:#444460;text-align:center;padding:12px;font-size:11px}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">⚡ HEATSEEKER</div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="clock" id="clock">—</span>
    <span class="live" id="pill">● LIVE</span>
  </div>
</div>

<!-- THE SIGNAL -->
<div class="signal-box flat" id="sig-box">
  <div class="sig-label">Bot Signal</div>
  <div class="sig-main sig-flat" id="sig-main">FLAT</div>
  <div class="sig-sub" id="sig-sub">Connecting...</div>
</div>

<!-- SPY / VIX / BALANCE -->
<div class="prices">
  <div class="price-card">
    <div class="pc-label">SPY</div>
    <div class="pc-val" id="p-spy" style="color:#e8e8f0">—</div>
  </div>
  <div class="price-card">
    <div class="pc-label">VIX</div>
    <div class="pc-val" id="p-vix" style="color:#888899">—</div>
  </div>
  <div class="price-card">
    <div class="pc-label">Balance</div>
    <div class="pc-val" id="p-bal" style="color:#4488ff">$21.64</div>
  </div>
</div>

<!-- VOL SIGNALS -->
<div class="vol-row">
  <div class="vol-chip">
    <div class="vc-label">Term Structure</div>
    <div class="vc-val" id="v-ts" style="color:#888899">—</div>
  </div>
  <div class="vol-chip">
    <div class="vc-label">Vanna Flow</div>
    <div class="vc-val" id="v-vanna" style="color:#888899">—</div>
  </div>
  <div class="vol-chip">
    <div class="vc-label">VIX3M (est)</div>
    <div class="vc-val" id="v-vix3m" style="color:#888899">—</div>
  </div>
</div>

<!-- BOT STATUS -->
<div class="status-card">
  <div class="status-title">🤖 Bot Status</div>
  <div class="status-text" id="last-action">Starting up...</div>
  <div class="status-updated" id="updated">—</div>
</div>

<!-- RECENT TRADES -->
<div class="journal-card">
  <div class="status-title">📋 Recent Trades — <span id="trade-count">0</span> total · P&L <span id="total-pnl" style="color:#888899">$0.00</span></div>
  <div id="journal"></div>
</div>

<script>
function clock(){
  const et=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));
  const p=n=>String(n).padStart(2,"0");
  document.getElementById("clock").textContent=`${p(et.getHours())}:${p(et.getMinutes())}:${p(et.getSeconds())} ET`;
}
setInterval(clock,1000); clock();

// Poll every 60s
let cd=5;
setInterval(()=>{ if(--cd<=0){ fetch_state(); cd=60; } },1000);

const vannaLabels={
  strong_vanna_bid:["STRONG BID","#00ff88"],
  vanna_bid:["VANNA BID","#88ffcc"],
  neutral:["NEUTRAL","#888899"],
  vanna_headwind:["HEADWIND","#ffaa00"],
  vanna_sell:["VANNA SELL","#ff3366"],
};
const tsLabels={
  deep_contango:["DEEP CONTANGO","#00ff88"],
  contango:["CONTANGO","#4488ff"],
  backwardation:["BACKWARDATION ⛔","#ff3366"],
};

async function fetch_state(){
  try{
    const r=await fetch("/api/state");
    if(!r.ok) throw 0;
    const d=await r.json();

    document.getElementById("pill").textContent="● LIVE";
    document.getElementById("pill").style.color="#00ff88";

    // SPY
    if(d.spot){ document.getElementById("p-spy").textContent="$"+Number(d.spot).toFixed(2); }

    // VIX
    if(d.vix){
      const vix=Number(d.vix);
      const vc=vix<18?"#00ff88":vix<25?"#ffaa00":"#ff3366";
      const el=document.getElementById("p-vix");
      el.textContent=vix.toFixed(2); el.style.color=vc;
    }

    // Balance
    if(d.balance) document.getElementById("p-bal").textContent="$"+Number(d.balance).toFixed(2);

    // Term structure
    if(d.ts_label){
      const [lbl,clr]=tsLabels[d.ts_label]||["—","#888899"];
      const el=document.getElementById("v-ts");
      el.textContent=lbl; el.style.color=clr;
    }

    // Vanna
    if(d.vanna_label){
      const [lbl,clr]=vannaLabels[d.vanna_label]||["—","#888899"];
      const el=document.getElementById("v-vanna");
      el.textContent=lbl; el.style.color=clr;
    }

    // VIX3M
    if(d.vix3m){
      const el=document.getElementById("v-vix3m");
      el.textContent=Number(d.vix3m).toFixed(2)+" (est)"; el.style.color="#4488ff";
    }

    // Signal — use bot's direction if set, else derive from vanna+ts
    let sig = d.direction; // "call"/"put"/null from bot
    if(!sig){
      const vix=d.vix||99;
      const ts=d.ts_label||"contango";
      const va=d.vanna_label||"neutral";
      if(vix<30 && ts!=="backwardation"){
        if(["strong_vanna_bid","vanna_bid","neutral"].includes(va)) sig="call";
        else if(["vanna_sell","vanna_headwind"].includes(va)) sig="put";
      }
    }
    const box=document.getElementById("sig-box");
    const main=document.getElementById("sig-main");
    const sub=document.getElementById("sig-sub");
    if(sig==="call"){
      box.className="signal-box call";
      main.className="sig-main sig-call"; main.textContent="▲ LONG CALL";
      sub.textContent="Vanna bid + contango — enter 0DTE call";
    } else if(sig==="put"){
      box.className="signal-box put";
      main.className="sig-main sig-put"; main.textContent="▼ LONG PUT";
      sub.textContent="Vanna selling + bearish flow — enter 0DTE put";
    } else {
      box.className="signal-box flat";
      main.className="sig-main sig-flat"; main.textContent="— FLAT";
      sub.textContent=d.vix>=30?"VIX too high — stay flat":d.ts_label==="backwardation"?"Backwardation — no entries":d.last_action||"No signal";
    }

    // Status
    document.getElementById("last-action").textContent=d.last_action||"—";
    document.getElementById("updated").textContent="Updated "+d.ts;

    // Stats
    document.getElementById("trade-count").textContent=d.total_trades||0;
    const pnl=d.total_pnl||0;
    const pnlEl=document.getElementById("total-pnl");
    pnlEl.textContent=(pnl>=0?"$+":"$")+Math.abs(pnl).toFixed(2);
    pnlEl.style.color=pnl>=0?"#00ff88":"#ff3366";

    // Journal
    const trades=(d.trades||[]).slice().reverse();
    const j=document.getElementById("journal");
    if(!trades.length){
      j.innerHTML='<div class="j-empty">No trades yet</div>';
    } else {
      j.innerHTML=trades.map(t=>{
        const type=t.opt_type==="call"?`<span class="j-type-call">CALL</span>`:`<span class="j-type-put">PUT</span>`;
        const pnl=t.pnl_pct!=null
          ?`<span class="${t.pnl_pct>0?"j-pnl-win":"j-pnl-loss"}">${t.pnl_pct>0?"+":""}${Math.round(t.pnl_pct)}% ($${t.pnl_usd>0?"+":""}${Number(t.pnl_usd||0).toFixed(2)})</span>`
          :t.exit_price==null?`<span class="j-open">OPEN</span>`:"";
        return `<div class="j-row"><span class="j-date">${t.date||""}</span>${type}<span class="j-strike">$${t.strike||""}</span>${pnl}</div>`;
      }).join("");
    }

  }catch(e){
    document.getElementById("pill").textContent="● OFFLINE";
    document.getElementById("pill").style.color="#ff3366";
  }
}

fetch_state();
</script>
</body>
</html>
