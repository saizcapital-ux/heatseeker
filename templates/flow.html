<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>HEATSEEKER — Chart + GEX Money Flow</title>
<script>window.__plotlyFailed=false;</script>
<script defer src="/static/plotly.min.js" onerror="window.__plotlyFailed=true"></script>
<style>
  :root{ --bg:#0a0c10; --panel:#0f1219; --border:#1c2030; --green:#00d084; --red:#ff3355;
    --blue:#4488ff; --yellow:#f5c842; --muted:#4a5470; --text:#c8ccd8;
    --font:'SF Mono','Fira Code',monospace; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
  #top{height:34px;display:flex;align-items:center;gap:16px;padding:0 14px;border-bottom:1px solid var(--border);background:#080a0e;font-size:12px}
  #top .logo{font-weight:700;letter-spacing:3px;color:var(--green)}
  #top .k{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-right:4px}
  #top .v{font-weight:700}
  #top .spy{color:#fff}#top .vix{color:var(--yellow)}
  #top .flow.bull{color:var(--green)}#top .flow.bear{color:var(--red)}
  #top .reg{margin-left:auto;font-weight:700;padding:3px 9px;border-radius:5px;font-size:11px}
  .reg.pin{background:rgba(0,208,132,.14);color:var(--green)}
  .reg.trend{background:rgba(255,51,85,.14);color:var(--red)}
  .reg.flip{background:rgba(245,140,66,.16);color:#ff8c42}
  #chart{width:100%;height:calc(100vh - 34px)}
  #ph{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--muted);text-align:center;font-size:13px}
  @media(max-width:640px){ #top{flex-wrap:wrap;height:auto;padding:6px 10px;gap:8px 14px} #chart{height:calc(100vh - 56px)} }
</style>
</head>
<body>
<div id="top">
  <span class="logo">HEATSEEKER</span>
  <span><span class="k">SPY</span><span class="v spy" id="t-spy">--</span></span>
  <span><span class="k">VIX</span><span class="v vix" id="t-vix">--</span></span>
  <span><span class="k">Flow</span><span class="v flow" id="t-flow">--</span></span>
  <span class="reg" id="t-reg">--</span>
</div>
<div id="chart"></div>
<div id="ph">Loading chart + GEX money flow…</div>

<script>
// Heartbeat: prove the inline script is executing. If the page stays on the
// static "Loading…" text, this line never ran (script blocked / not deployed).
(function(){ var p=document.getElementById('ph'); if(p) p.textContent='Starting… fetching data'; })();
var C={bg:'#0a0c10',green:'#00d084',red:'#ff3355',blue:'#4488ff',yellow:'#f5c842',muted:'#4a5470',text:'#c8ccd8',orange:'#ff8c42'};
var inited=false, lastData=null, lastHist=[];
function num(v){return (v==null||isNaN(v))?null:+v;}
function plotlyReady(){ return typeof Plotly!=='undefined' && !window.__plotlyFailed; }

function regime(d){
  var net=num(d.net_gex_total), spot=num(d.spot), flip=num(d.gamma_flip);
  if(net==null){ if(spot&&flip) return spot<flip?{t:'▼ TREND',c:'trend'}:{t:'▲ PIN',c:'pin'}; return {t:'--',c:''}; }
  var mag=Math.abs(net);
  if(mag<30&&spot&&flip&&Math.abs(spot-flip)/spot<0.004) return {t:'◆ NEAR FLIP',c:'flip'};
  if(net<0) return {t:'▼ TRENDING',c:'trend'};
  return {t:'▲ PINNING',c:'pin'};
}

function draw(d,hist){
  var ph=document.getElementById('ph');
  lastData=d; lastHist=hist;                       // remember for a re-draw when Plotly is ready
  if(window.__plotlyFailed){ ph.style.display='block'; ph.innerHTML='Chart library failed to load.<br><span style="font-size:10px">/static/plotly.min.js did not load — check the deploy</span>'; return; }
  if(typeof Plotly==='undefined'){
    ph.style.display='block'; ph.textContent='Loading chart library…';
    setTimeout(function(){ if(lastData) draw(lastData,lastHist); }, 300);   // re-check until ready
    return;
  }
  var spot=num(d.spot), candles=d.candles||[], gex=(d.gex_by_strike||[]).slice();
  if(!candles.length && !gex.length){
    ph.style.display='block';
    ph.innerHTML='Waiting for market data…<br><span style="font-size:10px">candles + GEX populate on the scan (every few min during market hours)</span>';
    return;
  }
  ph.style.display='none';
  var mob=window.innerWidth<=640, xR=mob?1:0.70;   // candle domain; GEX on the right ~30%
  var traces=[], shapes=[], annos=[];

  // ── price candles ──
  var yLo, yHi;
  if(candles.length){
    var t=candles.map(function(c){return c.t;});
    traces.push({type:'candlestick',x:t,
      open:candles.map(function(c){return c.o;}),high:candles.map(function(c){return c.h;}),
      low:candles.map(function(c){return c.l;}),close:candles.map(function(c){return c.c;}),
      increasing:{line:{color:C.green,width:1},fillcolor:C.green},
      decreasing:{line:{color:C.red,width:1},fillcolor:C.red},name:'SPY',
      hovertemplate:'<b>%{x|%H:%M}</b> O:%{open:.2f} H:%{high:.2f} L:%{low:.2f} C:%{close:.2f}<extra></extra>'});
    var lows=candles.map(function(c){return c.l;}), highs=candles.map(function(c){return c.h;});
    yLo=Math.min.apply(null,lows); yHi=Math.max.apply(null,highs);
  } else if(gex.length){
    var ks=gex.map(function(s){return s.strike;}); yLo=Math.min.apply(null,ks); yHi=Math.max.apply(null,ks);
  }
  if(spot){ yLo=Math.min(yLo,spot); yHi=Math.max(yHi,spot); }
  // frame the range to the key levels near spot so their lines show
  var glc=Math.max(6,(spot||500)*0.02);
  [d.gamma_flip,d.call_wall,d.put_wall,d.king_strike,d.max_pain].forEach(function(v){ v=num(v); if(v&&spot&&Math.abs(v-spot)<=glc){ yLo=Math.min(yLo,v); yHi=Math.max(yHi,v);} });
  var pad=((yHi-yLo)*0.06)||1; yLo-=pad; yHi+=pad;

  // ── GEX money flow histogram by strike (right side, shares price axis) ──
  if(gex.length){
    gex.sort(function(a,b){return a.strike-b.strike;});
    var vis=gex.filter(function(s){return s.strike>=yLo&&s.strike<=yHi;});
    if(vis.length){
      var netOf=function(s){return s.net_gex_m!=null?s.net_gex_m:(s.net_gex!=null?s.net_gex:(s.call_gex_m||0)+(s.put_gex_m||0));};
      traces.push({type:'bar',orientation:'h',xaxis:'x2',yaxis:'y',
        y:vis.map(function(s){return s.strike;}), x:vis.map(netOf),
        marker:{color:vis.map(function(s){return netOf(s)>=0?'rgba(0,208,132,.8)':'rgba(255,51,85,.8)';})},
        width:vis.map(function(){return 0.7;}),
        hovertemplate:'$%{y} · net GEX %{x:.2f}M<br>call OI %{customdata[0]:,} · put OI %{customdata[1]:,}<extra></extra>',
        customdata:vis.map(function(s){return [s.call_oi||0,s.put_oi||0];}),showlegend:false});
      var mN=0; vis.forEach(function(s){var n=Math.abs(netOf(s)); if(n>mN)mN=n;}); if(!mN)mN=1;
      annos.push({xref:'paper',yref:'paper',x:mob?0.5:((xR+1)/2),y:1,yanchor:'bottom',xanchor:'center',
        text:'GEX money flow →',showarrow:false,font:{size:9,color:C.muted,family:'monospace'}});
    }
  }

  // ── Money-flow CLOUD: each strike becomes a glowing horizontal band across
  //    the chart — green where calls are being bought, red where puts are,
  //    brighter = more volume. A smooth gradient cloud behind the candles. ──
  if(candles.length && gex.length){
    var fv=gex.filter(function(s){ return ((s.call_vol||0)+(s.put_vol||0))>0; });
    if(fv.length){
      var fxs=fv.map(function(s){return s.strike;});
      var fys=fv.map(function(s){return (s.call_vol||0)-(s.put_vol||0);});   // net directional volume
      var mN=0; fys.forEach(function(v){ if(Math.abs(v)>mN)mN=Math.abs(v); }); if(!mN)mN=1;
      var bw=Math.max(0.8,(yHi-yLo)/60);                                     // cloud band width (price pts)
      var flowAt=function(yv){ var n=0,dn=0; for(var i=0;i<fxs.length;i++){ var dd=yv-fxs[i], w=Math.exp(-dd*dd/(2*bw*bw)); n+=w*fys[i]; dn+=w; } return dn>0?n/dn:0; };
      var N=110, yg=[], zg=[], t0=candles[0].t, tN=candles[candles.length-1].t;
      for(var gi=0;gi<N;gi++){ var yv=yLo+(yHi-yLo)*gi/(N-1); yg.push(yv); var zv=flowAt(yv); zg.push([zv,zv]); }
      traces.unshift({type:'heatmap',x:[t0,tN],y:yg,z:zg,zsmooth:'best',zmin:-mN,zmax:mN,
        showscale:false,hoverinfo:'skip',
        colorscale:[[0,'rgba(255,51,85,0.55)'],[0.42,'rgba(255,51,85,0.10)'],[0.5,'rgba(10,12,16,0)'],[0.58,'rgba(0,208,132,0.10)'],[1,'rgba(0,208,132,0.55)']]});
      annos.push({xref:'paper',yref:'paper',x:0.012,y:0.90,xanchor:'left',yanchor:'top',
        text:'☁ money-flow cloud · green=calls bought · red=puts bought',showarrow:false,
        font:{size:mob?8:9,color:C.muted,family:'monospace'},bgcolor:'rgba(10,12,16,.6)',borderpad:2});
      // ── heaviest-flow line: the single strike with the most money ──
      var hi=fv[0]; fv.forEach(function(s){ if(((s.call_vol||0)+(s.put_vol||0)) > ((hi.call_vol||0)+(hi.put_vol||0))) hi=s; });
      if(hi.strike>=yLo && hi.strike<=yHi){
        var hiTot=(hi.call_vol||0)+(hi.put_vol||0), hiCall=(hi.call_vol||0)>=(hi.put_vol||0), hc=hiCall?C.green:C.red;
        shapes.push({type:'line',xref:'paper',yref:'y',x0:0,x1:1,y0:hi.strike,y1:hi.strike,line:{color:hc,width:1.5}});
        annos.push({xref:'paper',yref:'y',x:mob?0.5:0.34,y:hi.strike,xanchor:'center',yanchor:'bottom',
          text:'◆ HEAVIEST FLOW $'+Math.round(hi.strike)+' · '+hiTot.toLocaleString()+' ct '+(hiCall?'calls':'puts'),
          showarrow:false,font:{size:mob?8:10,color:hc,family:'monospace'},
          bgcolor:'rgba(10,12,16,.85)',bordercolor:hc,borderwidth:1,borderpad:2});
      }
    }
  }

  // ── key levels: flip + OI walls (labeled as dip/rip zones) + spot ──
  function hline(y,color,w,dash){ if(!y)return; shapes.push({type:'line',xref:'paper',yref:'y',x0:0,x1:1,y0:y,y1:y,line:{color:color,width:w,dash:dash}}); }
  function tag(y,color,text){ if(!y||y<yLo||y>yHi)return; annos.push({xref:'paper',yref:'y',x:0.008,y:y,xanchor:'left',yanchor:'middle',text:text,showarrow:false,font:{size:mob?8:10,color:color,family:'monospace'},bgcolor:'rgba(10,12,16,.82)',bordercolor:color,borderwidth:1,borderpad:2}); }
  hline(num(d.gamma_flip),C.yellow,1,'dot');    tag(num(d.gamma_flip),C.yellow,(mob?'FLIP ':'γ FLIP ')+Math.round(d.gamma_flip||0));
  hline(num(d.call_wall),C.red,1,'dot');        tag(num(d.call_wall),C.red,(mob?'RIP↓ ':'⬇ SHORT-RIP · CALL WALL ')+Math.round(d.call_wall||0));
  hline(num(d.put_wall),C.green,1,'dot');       tag(num(d.put_wall),C.green,(mob?'DIP↑ ':'⬆ BUY-DIP · PUT WALL ')+Math.round(d.put_wall||0));
  if(spot){ hline(spot,'#fff',1.5,'dash'); tag(spot,'#fff','● SPY '+spot.toFixed(2)); }

  // money-flow bias banner
  var cvt=num(d.call_vol_total)||0, pvt=num(d.put_vol_total)||0, tot=cvt+pvt;
  if(tot>0){ var bp=Math.round(cvt/tot*100), bull=bp>=50;
    annos.push({xref:'paper',yref:'paper',x:0.012,y:0.985,xanchor:'left',yanchor:'top',
      text:(bull?'💰 MONEY FLOW BULLISH ':'💰 MONEY FLOW BEARISH ')+(bull?bp:100-bp)+'% '+(bull?'· buying calls':'· buying puts'),
      showarrow:false,font:{size:mob?9:11,color:bull?C.green:C.red,family:'monospace'},
      bgcolor:'rgba(10,12,16,.8)',bordercolor:bull?C.green:C.red,borderwidth:1,borderpad:mob?3:5}); }

  var layout={paper_bgcolor:C.bg,plot_bgcolor:C.bg,font:{family:'monospace',color:C.text,size:10},
    margin:mob?{l:44,r:10,t:16,b:28}:{l:58,r:16,t:18,b:34},
    xaxis:{domain:[0,xR],type:'date',gridcolor:'rgba(28,32,48,.5)',color:C.muted,tickformat:'%H:%M',rangeslider:{visible:false}},
    xaxis2:{domain:mob?[0,1]:[xR+0.02,1],anchor:'y',zeroline:true,zerolinecolor:'rgba(74,84,112,.6)',showgrid:false,showticklabels:false,visible:!mob},
    yaxis:{gridcolor:'rgba(28,32,48,.5)',color:C.muted,tickformat:'$.0f',range:[yLo,yHi],side:'left'},
    shapes:shapes,annotations:annos,showlegend:false,hovermode:'closest',bargap:0.15,dragmode:'pan'};
  if(mob) layout.xaxis.domain=[0,1];  // on phone: candles full width, GEX overlays behind (kept subtle)

  var cfg={responsive:true,scrollZoom:true,displaylogo:false,
    modeBarButtonsToRemove:['select2d','lasso2d','toggleSpikelines','hoverClosestCartesian','hoverCompareCartesian']};
  if(!inited){ Plotly.newPlot('chart',traces,layout,cfg); inited=true; }
  else { layout.uirevision='flow'; Plotly.react('chart',traces,layout,cfg); }
}

function renderTop(d){
  var spy=num(d.spot), vix=num(d.vix);
  document.getElementById('t-spy').textContent= spy!=null?('$'+spy.toFixed(2)):'--';
  document.getElementById('t-vix').textContent= vix!=null?vix.toFixed(2):'--';
  var cvt=num(d.call_vol_total)||0, pvt=num(d.put_vol_total)||0, tot=cvt+pvt;
  var fe=document.getElementById('t-flow');
  if(tot>0){ var bp=Math.round(cvt/tot*100); if(bp>=55){fe.textContent=bp+'% calls';fe.className='v flow bull';}
    else if(bp<=45){fe.textContent=(100-bp)+'% puts';fe.className='v flow bear';}
    else {fe.textContent='split '+bp+'/'+(100-bp);fe.className='v flow';} }
  else { fe.textContent='--'; fe.className='v flow'; }
  var r=regime(d), re=document.getElementById('t-reg'); re.textContent=r.t; re.className='reg '+r.c;
}

function poll(){
  fetch('/api/state')
    .then(function(r){ if(!r.ok) throw new Error('state HTTP '+r.status); return r.json(); })
    .then(function(d){
      d=d||{};
      try{ renderTop(d); }catch(e){ console.error('renderTop',e); }
      return fetch('/api/history').then(function(r){return r.json();}).catch(function(){return {history:[]};})
        .then(function(h){ try{ draw(d,(h&&h.history)||[]); }catch(e){
          console.error('draw',e);
          var ph=document.getElementById('ph'); ph.style.display='block'; ph.textContent='Render error: '+e.message;
        } });
    })
    .catch(function(e){
      console.error('poll',e);
      var ph=document.getElementById('ph'); ph.style.display='block';
      ph.innerHTML='Can’t reach the data feed…<br><span style="font-size:10px">'+(e.message||e)+' — retrying</span>';
    });
}
poll(); setInterval(poll,8000);
window.addEventListener('resize',function(){ inited=false; });
</script>
</body>
</html>
